[package]
name = "eidos-lsp"
description = "LSP server for Eidos (phase 6) — stdio + eidos.* commands"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "eidos-lsp"
path = "src/main.rs"

[lib]
name = "eidos_lsp"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
eidos-core = { path = "../eidos-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = { workspace = true }
